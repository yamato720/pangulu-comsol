[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pangu-comsol"
version = "0.4.1"
description = "Terminal application and command-line tools for Pangu–COMSOL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["textual>=8.2.8,<9"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
pangu-comsol = "pangulu_comsol.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src/python"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["pangulu_comsol*"]
